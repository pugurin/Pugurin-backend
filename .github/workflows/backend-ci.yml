name: backend-ci

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "backend/**"
      - "compose.yaml"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compose로 db·redis·migrate·api 기동 (api가 healthy = 스키마 최신 + Redis 연결)
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: liveness·readiness 확인
        run: |
          curl -fs http://localhost:8000/api/v1/health
          curl -fs http://localhost:8000/internal/health/ready
      - name: 실패 시 로그
        if: failure()
        run: docker compose logs
