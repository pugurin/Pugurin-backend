# api(조회 서버) + db(PostGIS) + redis. migrate가 스키마·법정동 시드를 먼저 올리고 끝나면 api가 뜬다.
# api는 DB에서 조회한다(실데이터 모드). 처음에는 DB가 비어 있으니 `.cache`를 넣거나(load) worker로 수집한다. README 참고.
# worker(수집 → 지오코딩 → DB 적재, 매일 04시)는 API 키가 필요해서 `--profile worker`를 줄 때만 뜬다.
services:
  db:
    # postgis/postgis는 amd64 전용이라 Apple Silicon에서 느리다. 같은 관리자가 내는 멀티아키 이미지를 쓴다
    image: imresamu/postgis:16-3.5
    environment:
      POSTGRES_USER: pugurin
      POSTGRES_PASSWORD: pugurin
      POSTGRES_DB: pugurin
    ports:
      - "${PUGURIN_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pugurin -d pugurin"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${PUGURIN_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: ./backend
    command: ["python", "-m", "app.db", "upgrade"]
    environment:
      PUGURIN_DATABASE_URL: postgresql+asyncpg://pugurin:pugurin@db:5432/pugurin
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      PUGURIN_DATA_MODE: auto
      PUGURIN_DATABASE_URL: postgresql+asyncpg://pugurin:pugurin@db:5432/pugurin
      PUGURIN_REDIS_URL: redis://redis:6379/0
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      # readiness: DB 스키마가 최신이고 Redis가 닿아야 healthy. 거래가 비어 있으면 data가 warning이지만 healthy다
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/internal/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  worker:
    build: ./backend
    profiles: ["worker"]
    command: ["python", "-m", "app.ingestion", "worker"]
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      PUGURIN_DATABASE_URL: postgresql+asyncpg://pugurin:pugurin@db:5432/pugurin
    volumes:
      # 수집 캐시(원천 응답·지오코딩 결과)를 호스트와 같이 쓴다. 한도에 닿아 멈춰도 다음 실행이 이어서 받는다
      - ./backend/.cache:/app/.cache
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: on-failure:5  # 키가 없으면 안내를 남기고 몇 번 뒤 멈춘다

volumes:
  pgdata:
